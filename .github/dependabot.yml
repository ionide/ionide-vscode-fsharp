version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # generated by `gh aw compile` from repo-assist.md, update it by recompiling
    exclude-paths:
      - .github/workflows/repo-assist.lock.yml
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # 0.9 requires a mime type in parseFromString and throws on malformed XML,
      # see src/Imports/XPath.fs before moving to it
      - dependency-name: "@xmldom/xmldom"
        update-types: ["version-update:semver-minor"]
    groups:
      npm:
        patterns:
          - "*"

  # Dependabot does not support Paket (https://github.com/dependabot/dependabot-core/issues/2190),
  # so this only updates the tools in .config/dotnet-tools.json.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      dotnet-tools:
        patterns:
          - "*"
