name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # the release target commits the version bump and pushes it to main
    if: github.ref == 'refs/heads/main'
    # this workflow is the same as the build workflow, up until artifact upload + publish
    runs-on: windows-latest # can be any, just picked windows

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.tool-versions'
        cache: 'npm'
    - name: Restore tools
      run: dotnet tool restore
    # Workaround for https://github.com/fsprojects/Paket/issues/4461: Paket 11 and later fail to
    # create the git cache for a git dependency, so seed it. Remove once Paket is fixed.
    - name: Seed Paket git cache
      shell: bash
      run: git clone --mirror https://github.com/ionide/ionide-fsgrammar.git "${USERPROFILE:-$HOME}/.paket/git/db/ionide-fsgrammar"
    - name: Build package
      run: dotnet fsi build.fsx -p Package
    - name: upload artifact package
      uses: actions/upload-artifact@v7
      with:
        name: ionide-fsharp-vscode-ext
        path: release/
    - name: Publish Release
      env:
        # the version bump commit is authored by whoever triggered the release
        GIT_AUTHOR_NAME: ${{ github.actor }}
        GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        GIT_COMMITTER_NAME: ${{ github.actor }}
        GIT_COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
      run: dotnet fsi build.fsx -p Release
    - name: Point the extension pack at Open VSX
      run: dotnet fsi build.fsx -p OpenVsx
    - name: Publish to Open VSX Registry
      uses: HaaLeo/publish-vscode-extension@v2
      id: publishToOpenVSX
      with:
        packagePath: "./release"
        pat: ${{ secrets.OPEN_VSX_TOKEN }}
