name: Build Pull Requests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false # we have timing issues on some OS, so we want them all to run
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'yarn'
    - name: Restore tools
      run: dotnet tool restore
    # Workaround for https://github.com/fsprojects/Paket/issues/4461: Paket 11 and later fail to
    # create the git cache for a git dependency, so seed it. Remove once Paket is fixed.
    - name: Seed Paket git cache
      shell: bash
      run: git clone --mirror https://github.com/ionide/ionide-fsgrammar.git "${USERPROFILE:-$HOME}/.paket/git/db/ionide-fsgrammar"
    # Package checks the formatting, builds and packages the .vsix, so a PR runs everything the
    # release runs before it publishes.
    - name: Build and package
      run: dotnet fsi build.fsx -p Package
